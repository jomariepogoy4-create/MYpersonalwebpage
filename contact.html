<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>

  <link rel="stylesheet" href="style.css">

  <!-- EmailJS Library v4 -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // Isulod diri ang sakto nga Public Key gikan sa EmailJS Account Settings
      emailjs.init({
        publicKey: "53V1KobW3KCoFSlUE20qz",
      });
    })();
  </script>
</head>

<body>

  <!-- NAVIGATION BAR -->
  <nav>
    <ul>
      <li><a href="index.html">Introductions</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="hobbies.html">My Hobbies</a></li>
      <li><a href="favorites.html">My Favorites</a></li>
      <li><a href="goals.html">My Goals</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>

  <main>

    <section class="profile-section">
      <h1 id="main-header">Contact Me</h1>
      <hr>
      <p class="profile-info">
        Please fill out the form below to send me a message.
      </p>
    </section>

    <section class="contact-section" id="contact">

      <form id="contact-form">

        <div class="form-group">
          <label for="name" class="section-title">Full Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email" class="section-title">Gmail:</label>
          <input type="email" id="email" name="email" placeholder="Enter your Gmail" required>
        </div>

        <div class="form-group">
          <label class="section-title">Gender:</label>
          <div class="radio-group">
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
          </div>
        </div>

        <div class="form-group">
          <label class="section-title">Skills:</label>
          <div class="checkbox-group">
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label>
          </div>
        </div>

        <div class="form-group">
          <label for="strand" class="section-title">Strand:</label>
          <select id="strand" name="strand" required>
            <option value="">Select Strand</option>
            <option value="ICT">ICT</option>
            <option value="STEM">STEM</option>
            <option value="ABM">ABM</option>
            <option value="GAS">GAS</option>
            <option value="HUMSS">HUMSS</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message" class="section-title">Message:</label>
          <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn primary">Send Message</button>
          <button type="reset" class="btn">Clear Form</button>
        </div>

      </form>

    </section>

  </main>

  <!-- EmailJS Script -->
  <script type="text/javascript">
    document.getElementById("contact-form").addEventListener("submit", function(event) {
      event.preventDefault();

      // Wala gihilabtan imong Service ID ug Template ID
      emailjs.sendForm('service_95sl3fh', 'template_99dri0f', this)
        .then(function() {
          alert("Message sent successfully!");
          document.getElementById("contact-form").reset();
        }, function(error) {
          alert("Message failed to send. Check Console for details.");
          console.error("EmailJS Error:", error);
        });
    });
  </script>

</body>
</html>
